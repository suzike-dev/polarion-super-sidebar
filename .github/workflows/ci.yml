name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prepare project-local runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .runtime/node-v24.22.2-win-x64 | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination .runtime/node-v24.22.2-win-x64/node.exe
      - name: Check release version
        run: node scripts/version.mjs check
      - name: Typecheck, test and build
        shell: pwsh
        run: ./scripts/check.ps1
