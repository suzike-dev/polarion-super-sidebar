<title id="ro-title">软件需求分析总览 · 功能示意</title>
<desc id="ro-desc">纯矢量功能示意，全部工作项编号与名称为虚构；展示章节色带、分组块、条目平铺、搜索与阅读预览入口，非产品截图。</desc>
