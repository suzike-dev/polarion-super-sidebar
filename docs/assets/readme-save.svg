<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="586" viewBox="0 0 1000 586" role="img" aria-labelledby="title desc">
  <title id="title">从本地草稿到原生页面的保存路径</title>
  <desc id="desc">人和 AI 共用本地草稿。明确点击保存后，检查原生编辑状态、工作项归属和服务端版本，写入正文与附件，再独立回读。回读一致后更新当前原生页面，不重载页面。冲突或未知结果保留草稿，先核对再处理。该路径已在指定 Polarion 21R2 构建验证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#245c58" stroke-width="2"/></marker>
  </defs>
  <rect width="1000" height="586" fill="#f3f5f5"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#172a2e">
    <text x="36" y="54" font-size="30" font-weight="700">一次保存，跨过三个确认点。</text>
    <text x="36" y="87" font-size="18">草稿已同步到本机、服务端已写入、原生页面已更新，是不同状态。</text>
    <rect x="36" y="118" width="928" height="106" fill="#ffffff"/>
    <text x="60" y="157" font-size="25" font-weight="700">本地草稿</text>
    <text x="60" y="192" font-size="19">人工编辑 + AI 修改</text>
    <path d="M282 172H340" fill="none" stroke="#245c58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="367" y="157" font-size="25" font-weight="700">阅读与审阅</text>
    <text x="367" y="192" font-size="19">阅读预览 · 修改对照</text>
    <path d="M607 172H665" fill="none" stroke="#245c58" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="693" y="137" width="247" height="67" fill="#245c58"/>
    <text x="816" y="178" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">明确点击保存</text>
    <path d="M816 224V253H178V273" fill="none" stroke="#245c58" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="36" y="282" width="284" height="159" fill="#e2e9e8"/>
    <rect x="358" y="282" width="284" height="159" fill="#e2e9e8"/>
    <rect x="680" y="282" width="284" height="159" fill="#e2e9e8"/>
    <text x="60" y="324" font-size="25" font-weight="700">保存前检查</text>
    <text x="60" y="365" font-size="19">原生编辑状态 · 工作项归属</text>
    <text x="60" y="398" font-size="19">草稿修订 · 服务端版本</text>
    <text x="382" y="324" font-size="25" font-weight="700">写入与独立回读</text>
    <text x="382" y="365" font-size="19">正文 · 图片 · 画板附件</text>
    <text x="382" y="398" font-size="19">核对正文结果与附件内容</text>
    <text x="704" y="324" font-size="25" font-weight="700">更新原生页面</text>
    <text x="704" y="365" font-size="19">接纳新修订 · 更新原生正文</text>
    <text x="704" y="398" font-size="19">保留编辑器、会话与滚动</text>
    <path d="M326 360H349M648 360H671" fill="none" stroke="#245c58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="36" y="493" font-size="22" font-weight="700">冲突或结果不确定：保留草稿，核对后处理。</text>
    <text x="36" y="529" font-size="18">“免刷新”指保存不触发页面 / iframe 重载，原生文档模型仍会更新。</text>
    <text x="36" y="558" font-size="18">当前适配已验证的 Polarion 21R2 构建；其他构建在远程写入前停止。</text>
  </g>
</svg>
