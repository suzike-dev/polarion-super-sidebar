<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#4675B5"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect width="1400" height="850" fill="#F4F7FB"/><text x="36" y="52" font-size="32" fill="#16355A" font-weight="700">浏览器扩展 + 本地 Agent Host</text><text x="36" y="86" font-size="18" fill="#60718A" font-weight="400">明确区分页面上下文、模型执行、草稿与正式保存。外部表格仅提供读取数据。</text><rect x="30" y="140" width="340" height="280" rx="12" fill="#FFFFFF" stroke="#C4D2E4"/><text x="52" y="183" font-size="27" fill="#183B68" font-weight="700">浏览器扩展</text><text x="52" y="222" font-size="22" fill="#20324D" font-weight="400">Chrome / Edge / ego</text><text x="52" y="269" font-size="20" fill="#20324D" font-weight="400">统一侧栏与单工作项浮窗</text><text x="52" y="308" font-size="20" fill="#20324D" font-weight="400">原生 iframe / 选区 / 右键</text><text x="52" y="347" font-size="20" fill="#20324D" font-weight="400">差异审阅与保存操作</text><text x="52" y="387" font-size="20" fill="#20324D" font-weight="400">页面与本地状态同步</text><rect x="470" y="140" width="440" height="370" rx="12" fill="#EEF4FD" stroke="#97B5DD"/><text x="492" y="183" font-size="27" fill="#183B68" font-weight="700">独立本地 Host</text><text x="492" y="224" font-size="22" fill="#20324D" font-weight="400">会话与任务生命周期</text><text x="492" y="264" font-size="21" fill="#20324D" font-weight="400">上下文快照 / 草稿 / 修订记录</text><text x="492" y="304" font-size="21" fill="#20324D" font-weight="400">Polarion 与外部来源适配器</text><text x="492" y="344" font-size="20" fill="#20324D" font-weight="400">保存计划 → 预检 → 写入 → 回读</text><rect x="492" y="369" width="396" height="112" rx="12" fill="#FFFFFF" stroke="#CCD9EB"/><text x="511" y="407" font-size="23" fill="#2E578B" font-weight="600">SQLite + 资源缓存</text><text x="511" y="444" font-size="18" fill="#20324D" font-weight="400">运行事件、版本、结果与恢复记录</text><path d="M372 243 L464 243" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="211" font-size="17" fill="#4675B5" font-weight="400">上下文</text><path d="M464 315 L372 315" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="347" font-size="16" fill="#4675B5" font-weight="400">事件 / 草稿</text><rect x="1030" y="140" width="340" height="280" rx="12" fill="#FFFFFF" stroke="#C4D2E4"/><text x="1052" y="183" font-size="27" fill="#183B68" font-weight="700">Polarion</text><text x="1052" y="228" font-size="22" fill="#20324D" font-weight="400">正式文档与工作项</text><text x="1052" y="270" font-size="21" fill="#20324D" font-weight="400">字段 / 附件 / 追溯</text><text x="1052" y="312" font-size="21" fill="#20324D" font-weight="400">历史与项目工作流</text><text x="1052" y="363" font-size="18" fill="#60718A" font-weight="400">21 R2 能力逐项验证</text><path d="M914 244 L1024 244" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="918" y="211" font-size="16" fill="#4675B5" font-weight="400">审阅后保存</text><path d="M1024 315 L914 315" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="918" y="347" font-size="16" fill="#4675B5" font-weight="400">读取 / 回读</text><rect x="30" y="567" width="490" height="198" rx="12" fill="#FFFFFF" stroke="#C4D2E4"/><text x="52" y="610" font-size="26" fill="#183B68" font-weight="700">外部资料 · 只读</text><text x="52" y="653" font-size="21" fill="#20324D" font-weight="400">本地 Excel / CSV</text><text x="52" y="693" font-size="21" fill="#20324D" font-weight="400">飞书电子表格 / Microsoft 365 Excel</text><text x="52" y="735" font-size="18" fill="#60718A" font-weight="400">稳定身份、范围、版本和共同基准</text><path d="M344 563 L493 510" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="225" y="533" font-size="17" fill="#4675B5" font-weight="400">读取 → 比对 → 合并草稿</text><rect x="620" y="567" width="750" height="198" rx="12" fill="#FFFFFF" stroke="#C4D2E4"/><text x="642" y="610" font-size="26" fill="#183B68" font-weight="700">本机 Agent 运行时</text><text x="642" y="653" font-size="21" fill="#20324D" font-weight="400">Codex app-server   /   Claude Code Agent SDK 或 CLI</text><text x="642" y="693" font-size="20" fill="#20324D" font-weight="400">持续会话、工具、Skills、MCP、流式事件、取消与恢复</text><text x="642" y="735" font-size="18" fill="#60718A" font-weight="400">全局默认引擎决定新会话；旧会话保留原引擎</text><path d="M776 563 L776 517" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M848 517 L848 563" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="889" y="544" font-size="17" fill="#4675B5" font-weight="400">任务 / 草稿操作 / 事件</text><text x="36" y="818" font-size="18" fill="#60718A" font-weight="400">技术建议图；本轮没有运行目标扩展、业务写入或云端连接器验收。</text></g></svg>