<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="readme-library-title readme-library-desc">
<title id="readme-library-title">内置工程素材库：36 项可编辑矢量素材</title>
<desc id="readme-library-desc">四类素材各选两个实际定义示例：流程 8 项，系统与接口 8 项，控制逻辑 8 项，热管理 12 项；本图是素材目录示意，不是产品截图。</desc>
