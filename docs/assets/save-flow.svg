<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#4675B5"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect width="1400" height="640" fill="#F4F7FB"/><text x="36" y="52" font-size="32" fill="#16355A" font-weight="700">从草稿到已保存</text><text x="36" y="86" font-size="18" fill="#60718A" font-weight="400">保存只写 Polarion。草稿撤销与已保存内容的逆向修改是两种操作。</text><rect x="32" y="170" width="196" height="116" rx="12" fill="#FFFFFF" stroke="#DCE3ED"/><text x="48" y="210" font-size="24" fill="#183B68" font-weight="700">编辑草稿</text><text x="48" y="249" font-size="17" fill="#60718A" font-weight="400">人工与 AI 共用</text><path d="M230 228 L256 228" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="170" width="196" height="116" rx="12" fill="#FFFFFF" stroke="#DCE3ED"/><text x="276" y="210" font-size="24" fill="#183B68" font-weight="700">差异审阅</text><text x="276" y="249" font-size="17" fill="#60718A" font-weight="400">内容 / 表格 / 结构</text><path d="M458 228 L484 228" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="488" y="170" width="196" height="116" rx="12" fill="#FFFFFF" stroke="#DCE3ED"/><text x="504" y="210" font-size="24" fill="#183B68" font-weight="700">保存预检</text><text x="504" y="249" font-size="17" fill="#60718A" font-weight="400">对象 / 版本 / 必填</text><path d="M686 228 L712 228" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="716" y="170" width="196" height="116" rx="12" fill="#FFFFFF" stroke="#DCE3ED"/><text x="732" y="210" font-size="24" fill="#183B68" font-weight="700">执行写入</text><text x="732" y="249" font-size="17" fill="#60718A" font-weight="400">按依赖顺序执行</text><path d="M914 228 L940 228" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="944" y="170" width="196" height="116" rx="12" fill="#FFFFFF" stroke="#DCE3ED"/><text x="960" y="210" font-size="24" fill="#183B68" font-weight="700">独立回读</text><text x="960" y="249" font-size="17" fill="#60718A" font-weight="400">核对实际对象</text><path d="M1142 228 L1168 228" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="1172" y="170" width="196" height="116" rx="12" fill="#EAF5EE" stroke="#DCE3ED"/><text x="1188" y="210" font-size="24" fill="#183B68" font-weight="700">已保存</text><text x="1188" y="249" font-size="17" fill="#60718A" font-weight="400">更新基准与原页面</text><path d="M587 290 L587 366" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="374" width="316" height="110" rx="12" fill="#FFF6E8" stroke="#E7C69B"/><text x="450" y="411" font-size="22" fill="#835524" font-weight="600">冲突 / 原生未保存修改</text><text x="450" y="447" font-size="18" fill="#835524" font-weight="400">保留草稿，处理后重新预检</text><path d="M930 290 L930 366" stroke="#4675B5" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="788" y="374" width="500" height="110" rx="12" fill="#FFF1EF" stroke="#E4B5AE"/><text x="810" y="411" font-size="22" fill="#924C44" font-weight="600">部分完成 / 失败 / 结果未知</text><text x="810" y="447" font-size="18" fill="#924C44" font-weight="400">逐项对账；非幂等操作不盲目重试</text><text x="36" y="558" font-size="22" fill="#365A84" font-weight="600">只有回读确认成功，才能显示“已保存”。页面刷新状态与服务器保存结果分别记录。</text><text x="36" y="602" font-size="18" fill="#60718A" font-weight="400">设计说明：多工作项保存采用逐项日志和恢复流程，不假定服务端存在跨对象原子事务。</text></g></svg>