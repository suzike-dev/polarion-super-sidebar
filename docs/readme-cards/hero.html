<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1520px; height: 760px; font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif; }
  .hero { position: relative; width: 100%; height: 100%; background: #16281E; overflow: hidden; }
  .deco { position: absolute; right: -140px; top: -180px; width: 560px; height: 560px; background: #D8EBAD; transform: rotate(24deg); border-radius: 28px; }
  .deco2 { position: absolute; right: 60px; bottom: -220px; width: 380px; height: 380px; border: 2px solid #2E4A38; border-radius: 50%; }
  .head { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; background: #D8EBAD; border-radius: 12px; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: #1E3B24; }
  .head span { font-size: 15px; letter-spacing: .35em; color: #9DB2A0; font-weight: 600; }
  .eyebrow { position: absolute; left: 64px; top: 168px; font-size: 15px; letter-spacing: .5em; color: #6E8A72; font-weight: 700; }
  h1 { position: absolute; left: 60px; top: 210px; font-size: 76px; line-height: 1.32; color: #F1F6EC; font-weight: 700; letter-spacing: .02em; }
  h1 .dot { color: #D8EBAD; }
  .sub { position: absolute; left: 64px; top: 452px; font-size: 20px; line-height: 1.8; color: #A8BCA6; }
  .tags { position: absolute; left: 64px; top: 560px; display: flex; gap: 12px; }
  .tag { padding: 9px 20px; border: 1px solid #3E5C46; border-radius: 999px; color: #DCE8D6; font-size: 16px; letter-spacing: .08em; }
  .foot { position: absolute; left: 64px; bottom: 44px; font-size: 12px; letter-spacing: .3em; color: #5E7A64; font-weight: 600; }
  .side { position: absolute; right: 150px; top: 250px; width: 400px; height: 300px; background: #1D3527; border: 1px solid #2E4A38; border-radius: 16px; padding: 26px; }
  .side .win { display: flex; gap: 6px; margin-bottom: 18px; }
  .side .win i { width: 9px; height: 9px; border-radius: 50%; background: #3E5C46; }
  .side h3 { font-size: 19px; color: #F1F6EC; margin-bottom: 12px; }
  .side p { font-size: 14px; line-height: 1.9; color: #9DB2A0; }
  .pill { position: absolute; right: 190px; top: 590px; display: flex; gap: 10px; }
  .pill span { padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .pill .lime { background: #D8EBAD; color: #1E3B24; }
  .pill .dark { background: #2E4A38; color: #DCE8D6; }
</style>
</head>
<body>
<div class="hero">
  <div class="deco"></div>
  <div class="deco2"></div>
  <div class="head"><div class="logo">P＋</div><span>NANJU / ENGINEERING INTELLIGENCE</span></div>
  <div class="eyebrow">POLARION SUPER SIDEBAR</div>
  <h1>让需求工程<br>拥有 AI 协作侧翼<span class="dot">。</span></h1>
  <div class="sub">看清整份需求，在正文旁与本地 Agent 协作。<br>编辑、绘图、审阅，再保存回 Polarion。</div>
  <div class="tags">
    <span class="tag">需求全景</span><span class="tag">共享草稿</span><span class="tag">可编辑工程图</span><span class="tag">原生写回</span>
  </div>
  <div class="side">
    <div class="win"><i></i><i></i><i></i></div>
    <h3>需求全景 · 编辑工作台</h3>
    <p>章节矩阵一屏定位；正文旁 AI 协作，检查歧义、保留工程参数；草稿先行，明确保存回 Polarion。</p>
  </div>
  <div class="pill"><span class="lime">保存到 Polarion</span><span class="dark">草稿已更新</span></div>
  <div class="foot">ONE CONTEXT. ONE DRAFT. REVIEWED WRITEBACK.</div>
</div>
</body>
</html>
